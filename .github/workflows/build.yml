name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qt5-qmake \
            qtbase5-dev \
            qttools5-dev-tools \
            libdtkwidget-dev \
            debhelper \
            pkg-config

      - name: Compile translations
        run: |
          for ts in translations/*.ts; do
            if [ -f "$ts" ]; then
              lrelease "$ts" -qm "${ts%.ts}.qm"
            fi
          done

      - name: Build application
        run: |
          qmake DeepinVentoyInstaller.pro
          make -j$(nproc)

      - name: Prepare DEB structure
        run: |
          mkdir -p debian/deepin-ventoy-installer/usr/bin
          mkdir -p debian/deepin-ventoy-installer/usr/share/applications
          mkdir -p debian/deepin-ventoy-installer/usr/share/icons/hicolor/512x512/apps
          mkdir -p debian/deepin-ventoy-installer/usr/share/deepin-ventoy-installer/translations

          # Copy binary
          cp dvtoyinst debian/deepin-ventoy-installer/usr/bin/

          # Copy desktop file
          cp dvtoyinst.desktop debian/deepin-ventoy-installer/usr/share/applications/

          # Copy icon
          cp res/dvtoyinst.png debian/deepin-ventoy-installer/usr/share/icons/hicolor/512x512/apps/

          # Copy translations
          cp translations/*.qm debian/deepin-ventoy-installer/usr/share/deepin-ventoy-installer/translations/

      - name: Create DEB package with maximum compression
        run: |
          dpkg-deb -Zxz -z9 --build debian/deepin-ventoy-installer deepin-ventoy-installer_1.0.0-1_amd64.deb

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: deepin-ventoy-installer.deb
          path: deepin-ventoy-installer_1.0.0-1_amd64.deb

