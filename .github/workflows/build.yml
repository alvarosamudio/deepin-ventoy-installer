name: Build and Package

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            qt6-base-dev \
            qt6-tools-dev \
            qt6-tools-dev-tools \
            libdtk6widget-dev \
            debhelper \
            pkg-config

      - name: Build application
        run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Prepare DEB structure
        run: |
          mkdir -p debian/deepin-ventoy-installer/usr/bin
          mkdir -p debian/deepin-ventoy-installer/usr/share/applications
          mkdir -p debian/deepin-ventoy-installer/usr/share/icons/hicolor/512x512/apps
          mkdir -p debian/deepin-ventoy-installer/usr/share/deepin-ventoy-installer/translations

          # Copy binary
          cp build/deepin-ventoy-installer debian/deepin-ventoy-installer/usr/bin/

          # Copy desktop file
          cp src/dvtoyinst.desktop debian/deepin-ventoy-installer/usr/share/applications/

          # Copy icon
          cp src/res/dvtoyinst.png debian/deepin-ventoy-installer/usr/share/icons/hicolor/512x512/apps/

          # Copy translations
          cp build/*.qm debian/deepin-ventoy-installer/usr/share/deepin-ventoy-installer/translations/ 2>/dev/null || true

      - name: Create DEB package with maximum compression
        run: |
          dpkg-deb -Zxz -z9 --build debian/deepin-ventoy-installer deepin-ventoy-installer_1.1.0-1_amd64.deb

      - name: Upload DEB package
        uses: actions/upload-artifact@v4
        with:
          name: deepin-ventoy-installer.deb
          path: deepin-ventoy-installer_1.1.0-1_amd64.deb

