version: "1"

package:
  id: org.deepinenespanol.deepin-ventoy-installer
  name: "Deepin Ventoy Installer"
  version: 1.1.0.0
  kind: app
  description: |
    Graphical Ventoy installer for Deepin built with DTK.

command:
  - /opt/apps/org.deepinenespanol.deepin-ventoy-installer/files/bin/deepin-ventoy-installer

base: org.deepin.base/25.2.2
runtime: org.deepin.runtime.dtk/25.2.2

# Se empaqueta el .deb ya compilado (el CI lo deja en debs/).
# Se lee de /project/debs/ porque ll-builder vacia linglong/sources.
build: |
  dpkg-deb -X /project/debs/deepin-ventoy-installer_*.deb $PREFIX/
  mv $PREFIX/usr/bin $PREFIX/bin
  mv $PREFIX/usr/share $PREFIX/share
  rm -rf $PREFIX/usr
  mv $PREFIX/share/applications/dvtoyinst.desktop $PREFIX/share/applications/org.deepinenespanol.deepin-ventoy-installer.desktop
  sed -i 's#^Exec=.*#Exec=/opt/apps/org.deepinenespanol.deepin-ventoy-installer/files/bin/deepin-ventoy-installer#' \
      $PREFIX/share/applications/org.deepinenespanol.deepin-ventoy-installer.desktop

sources: []
